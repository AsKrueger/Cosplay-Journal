[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
work = "2.10.0"
documentfile = "1.0.1"
coil = "2.7.0"
kotlinxSerialization = "1.7.3"
coroutines = "1.9.0"
supabase = "3.0.3"
ktor = "3.0.2"
junit = "4.13.2"
mockk = "1.13.13"
