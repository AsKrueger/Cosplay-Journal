spring.application.name=cosplay-journal-backend
spring.profiles.active=local

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Synchronization Settings
cosplay-journal.events.sync.enabled=${EVENT_SYNC_ENABLED:true}
cosplay-journal.events.sync.cron=${EVENT_SYNC_CRON:0 0 */6 * * *}

# External ListadoManga Settings
integrations.listadomanga.url=${LISTADOMANGA_URL:https://www.listadomanga.es/salones.php}
integrations.listadomanga.connect-timeout=${LISTADOMANGA_CONNECT_TIMEOUT:5000}
integrations.listadomanga.read-timeout=${LISTADOMANGA_READ_TIMEOUT:10000}
integrations.listadomanga.retry.enabled=${LISTADOMANGA_RETRY_ENABLED:true}
integrations.listadomanga.retry.max-attempts=${LISTADOMANGA_MAX_ATTEMPTS:3}
integrations.listadomanga.retry.backoff-ms=${LISTADOMANGA_BACKOFF_MS:1000}
