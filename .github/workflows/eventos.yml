name: Eventos

on:
  pull_request:
    paths: ['scraper/**', '.github/workflows/eventos.yml']
  push:
    branches: [develop, main]
    paths: ['scraper/**']
  schedule:
    - cron: '30 5 * * *' # cada día a las 06:30 (hora peninsular en invierno)
  workflow_dispatch:

jobs:
  tests:
    name: Tests del importador
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt pytest==8.3.3
      - run: python -m pytest -q

  importar:
    name: Importar salones a Supabase
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # para reactivar este cron (ver último paso)
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Importar
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL/SUPABASE_SERVICE_KEY; ver docs/PUESTA_EN_MARCHA.md"
            exit 0
          fi
          python -m cosplay_scraper.main

      # GitHub desactiva los crons de un repositorio sin actividad en 60 días. Sin este cron
      # Supabase pausaría el proyecto gratuito a la semana; reactivarlo cada día lo evita.
      - name: Mantener activo el cron
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/eventos.yml/enable"
