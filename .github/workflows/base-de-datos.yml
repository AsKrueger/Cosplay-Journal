name: Base de datos

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/base-de-datos.yml']
  push:
    branches: [develop, main]
    paths: ['supabase/**']

jobs:
  politicas:
    name: Migraciones y políticas RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
